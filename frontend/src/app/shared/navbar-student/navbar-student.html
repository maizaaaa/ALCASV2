<header class="student-navbar">
  <div class="navbar-container">

    <!-- Left Brand Section -->
    <div class="brand-section">
      <div class="brand-icon">CE</div>
      <div class="brand-text">
        <span class="brand-title">ConsultEase</span>
        <span class="role-badge student">Student</span>
      </div>
    </div>

    <!-- Desktop Navigation Links -->
    <nav class="desktop-nav">
      <a routerLink="/student" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}"
        (click)="closeMobileMenu()" class="nav-item">
        <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
        </svg>
        <span>My Schedule</span>
      </a>

      <a routerLink="/student/book" routerLinkActive="active" (click)="closeMobileMenu()" class="nav-item">
        <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
        </svg>
        <span>Booking</span>
      </a>

      <a routerLink="/student/history" routerLinkActive="active" (click)="closeMobileMenu()" class="nav-item">
        <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
        <span>History</span>
      </a>

      <a routerLink="/student/setting" routerLinkActive="active" (click)="closeMobileMenu()" class="nav-item">
        <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
        <span>Settings</span>
      </a>
    </nav>

    <!-- Right Controls Section -->
    <div class="controls-section">


      <!-- Student Profile Badge -->
      <a routerLink="/student/profile" class="user-profile-badge" title="My Profile">
        <div class="avatar-circle">{{ studentInitial }}</div>
        <span class="user-name">{{ studentName }}</span>
      </a>

      <!-- Dark Mode Toggle Button -->
      <button class="theme-toggle-btn" (click)="toggleDarkMode()" title="Toggle Dark/Light Mode">
        <ng-container *ngIf="!isDarkMode">
          <svg class="control-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
          </svg>
        </ng-container>
        <ng-container *ngIf="isDarkMode">
          <svg class="control-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m12.728 0l-.707-.707M6.343 6.343l-.707-.707M14 12a2 2 0 11-4 0 2 2 0 014 0z">
            </path>
          </svg>
        </ng-container>
      </button>

      <!-- Sign Out Button -->
      <button class="logout-btn" (click)="onLogout()" title="Sign Out">
        <svg class="control-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
        </svg>
        <span class="btn-label">Sign Out</span>
      </button>

      <!-- Mobile Hamburger Toggle -->
      <button class="hamburger-btn" (click)="toggleMobileMenu()" title="Toggle Navigation Menu">
        <svg class="control-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path *ngIf="!isMobileMenuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M4 6h16M4 12h16M4 18h16"></path>
          <path *ngIf="isMobileMenuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>

  </div>

  <!-- Mobile Drawer Menu -->
  <div class="mobile-drawer" *ngIf="isMobileMenuOpen">
    <nav class="mobile-nav">
      <a routerLink="/student" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}"
        (click)="closeMobileMenu()" class="mobile-nav-item">
        <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
        </svg>
        <span>My Schedule</span>
      </a>

      <a routerLink="/student/book" routerLinkActive="active" (click)="closeMobileMenu()" class="mobile-nav-item">
        <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
        </svg>
        <span>Booking</span>
      </a>

      <a routerLink="/student/history" routerLinkActive="active" (click)="closeMobileMenu()" class="mobile-nav-item">
        <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
        <span>History</span>
      </a>

    </nav>
  </div>
</header>
