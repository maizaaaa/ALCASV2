<div
  class="min-h-screen relative overflow-x-hidden font-sans text-slate-800 dark:text-slate-100 flex flex-col student-dashboard-bg">

  <div class="fixed inset-0 z-0 pointer-events-none opacity-[0.15] dark:opacity-30">
    <div class="absolute -top-[10%] -left-[10%] w-[600px] h-[600px] bg-teal-400/80 rounded-full blur-[120px]"></div>
    <div class="absolute top-[40%] -right-[10%] w-[500px] h-[500px] bg-cyan-400/60 rounded-full blur-[120px]"></div>
    <div class="absolute -bottom-[10%] -left-[10%] w-[600px] h-[600px] bg-emerald-400/60 rounded-full blur-[120px]">
    </div>
  </div>

  <div class="relative z-10 flex flex-col min-h-screen">

    <app-navbar-student></app-navbar-student>

    <main class="max-w-7xl mx-auto w-full p-10 flex-1 box-border">

      <div class="flex justify-between items-end mb-8 relative">
        <div>
          <h1
            class="text-4xl font-extrabold bg-gradient-to-r from-slate-900 to-teal-800 dark:from-white dark:via-white dark:to-cyan-200 bg-clip-text text-transparent tracking-tight mb-1">
            Weekly Schedule</h1>
          <div class="flex items-center gap-3 flex-wrap">
            <p class="text-teal-600 dark:text-teal-400 font-bold opacity-80 flex items-center gap-2">
              <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd"
                  d="M6 2a1 1 0 00-1 1v1H4a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V6a2 2 0 00-2-2h-1v-1a1 1 0 10-2 0v1H7V3a1 1 0 00-1-1zm0 5a1 1 0 000 2h8a1 1 0 100-2H6z"
                  clip-rule="evenodd"></path>
              </svg>
              {{ currentWeek }}
            </p>
            <div class="flex items-center gap-1.5 bg-slate-100/80 dark:bg-teal-950/40 p-1 rounded-xl border border-slate-200/60 dark:border-teal-900/40">
              <button (click)="previousWeek()" class="p-1 rounded-lg hover:bg-white dark:hover:bg-teal-900/60 text-slate-600 dark:text-teal-300 transition-all" title="Previous Week">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
              </button>
              <button (click)="goToCurrentWeek()" *ngIf="currentWeekOffset !== 0" class="px-2 py-0.5 text-[11px] font-extrabold uppercase rounded-lg bg-teal-600 text-white shadow-xs hover:bg-teal-700 transition-colors">
                Current
              </button>
              <button (click)="nextWeek()" class="p-1 rounded-lg hover:bg-white dark:hover:bg-teal-900/60 text-slate-600 dark:text-teal-300 transition-all" title="Next Week">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/></svg>
              </button>
            </div>
          </div>
        </div>
        <button routerLink="/student/book"
          class="flex items-center gap-2 bg-gradient-to-r from-teal-600 to-emerald-500 hover:from-teal-700 hover:to-emerald-600 text-white px-6 py-3 rounded-xl font-bold shadow-xl shadow-teal-500/20 dark:shadow-teal-950/30 transition-all transform hover:-translate-y-1">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" class="w-5 h-5">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>
          Search & Book
        </button>
      </div>

      <div
        class="hybrid-calendar-card bg-white/95 dark:bg-[#071317]/80 backdrop-blur-2xl border border-slate-100 dark:border-teal-900/40 shadow-[0_15px_50px_rgba(15,118,110,0.06)] dark:shadow-[0_10px_40px_rgba(45,212,191,0.05)] rounded-[2rem] overflow-hidden">

        <div
          class="grid min-h-[600px]"
          [style.gridTemplateColumns]="'repeat(' + weekDays.length + ', minmax(0, 1fr))'">

          <div
            class="flex flex-col relative after:content-[''] after:absolute after:right-0 after:top-0 after:bottom-0 after:w-[1px] after:bg-slate-100 dark:after:bg-teal-900/20 last:after:hidden"
            *ngFor="let day of weekDays">

            <div
              class="p-5 text-center bg-slate-50/40 dark:bg-[#09151A]/60 border-b border-slate-100 dark:border-teal-900/20">
              <h3 class="text-xs font-black text-slate-500 dark:text-teal-400 uppercase tracking-widest">{{ day }}</h3>
            </div>

            <div class="p-4 flex-1 flex flex-col gap-4">

              <!-- Unified Schedule Items (Appointments & Class Slots sorted chronologically by time) -->
              <ng-container *ngFor="let item of getScheduleItemsForDay(day)">

                <!-- APPOINTMENT ITEM -->
                <div *ngIf="item.kind === 'appointment'" routerLink="/student/history"
                  class="fade-in-up group relative p-5 rounded-3xl shadow-sm border transition-all duration-300 hover:-translate-y-1.5 hover:shadow-xl cursor-pointer overflow-hidden"
                  [ngClass]="item.status === 'CONFIRMED' ? 'bg-gradient-to-br from-emerald-50/90 to-teal-50/70 border-emerald-200/80 text-emerald-950 dark:from-teal-950/50 dark:to-emerald-950/30 dark:border-teal-800/60 dark:text-teal-100 hover:shadow-teal-500/10' : 'bg-gradient-to-br from-amber-50/90 to-orange-50/70 border-amber-200/80 text-amber-950 dark:from-amber-950/50 dark:to-orange-950/30 dark:border-amber-800/60 dark:text-amber-100 hover:shadow-amber-500/10'">

                  <div
                    class="absolute -right-6 -top-6 w-24 h-24 rounded-full opacity-30 dark:opacity-20 blur-2xl transition-all group-hover:scale-150"
                    [ngClass]="item.status === 'CONFIRMED' ? 'bg-emerald-400 dark:bg-teal-500' : 'bg-amber-400 dark:bg-amber-500'">
                  </div>

                  <div class="relative z-10">
                    <div class="text-xs font-black opacity-70 mb-2 flex items-center gap-1.5">
                      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3"
                          d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                      </svg>
                      {{ item.time }}
                    </div>

                    <div class="text-[15px] font-extrabold mb-1 tracking-tight leading-snug">{{ item.title }}</div>
                    <div class="text-[13px] font-bold opacity-75 mb-4">{{ item.description }}</div>

                    <span
                      class="inline-block px-3 py-1.5 rounded-xl text-[10px] font-black uppercase tracking-wider shadow-xs backdrop-blur-sm"
                      [ngClass]="item.status === 'CONFIRMED' ? 'bg-emerald-200/90 text-emerald-900 border border-emerald-300/80 dark:bg-teal-900/90 dark:text-teal-200 dark:border-teal-700/80' : 'bg-amber-200/90 text-amber-900 border border-amber-300/80 dark:bg-amber-900/90 dark:text-amber-200 dark:border-amber-700/80'">
                      {{ item.status }}
                    </span>
                  </div>

                </div>

                <!-- CLASS SCHEDULE ITEM -->
                <div *ngIf="item.kind === 'class'" routerLink="/student/profile"
                  class="fade-in-up group relative p-5 rounded-3xl shadow-sm border border-indigo-200/80 dark:border-indigo-800/60 bg-gradient-to-br from-indigo-50/90 via-sky-50/60 to-purple-50/40 dark:from-indigo-950/50 dark:via-slate-900/60 dark:to-purple-950/30 text-indigo-950 dark:text-indigo-200 transition-all duration-300 hover:-translate-y-1.5 hover:shadow-xl hover:shadow-indigo-500/10 cursor-pointer overflow-hidden">

                  <div
                    class="absolute -right-6 -top-6 w-24 h-24 rounded-full bg-indigo-400/30 dark:bg-indigo-500/20 blur-2xl transition-all group-hover:scale-150">
                  </div>

                  <div class="relative z-10">
                    <div class="text-xs font-black text-indigo-600 dark:text-indigo-400 mb-2 flex items-center gap-1.5">
                      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3"
                          d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                      </svg>
                      {{ item.time }}
                    </div>

                    <div class="text-[15px] font-extrabold text-slate-900 dark:text-white mb-1 tracking-tight leading-snug">
                      {{ item.title }}
                    </div>

                    <div class="text-[13px] font-bold text-indigo-600/80 dark:text-indigo-300/80 mb-4">
                      {{ item.description }}
                    </div>

                    <span
                      class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-[10px] font-black uppercase tracking-wider bg-indigo-200/80 text-indigo-900 border border-indigo-300/80 dark:bg-indigo-900/80 dark:text-indigo-200 dark:border-indigo-700/80 shadow-xs backdrop-blur-sm">
                      <span class="w-1.5 h-1.5 rounded-full bg-indigo-500 animate-pulse"></span>
                      Class Slot
                    </span>
                  </div>

                </div>

              </ng-container>

              <!-- Empty Column Interactive Action -->
              <div *ngIf="getScheduleItemsForDay(day).length === 0" routerLink="/student/book"
                class="flex-1 flex flex-col items-center justify-center border-2 border-dashed border-slate-200/60 dark:border-teal-950/20 hover:border-teal-300 dark:hover:border-teal-800/60 rounded-3xl p-6 text-slate-400 hover:text-teal-600 dark:hover:text-teal-400 hover:bg-teal-50/20 dark:hover:bg-teal-950/10 transition-all duration-300 cursor-pointer group/empty min-h-[160px]">
                <div
                  class="w-10 h-10 rounded-full bg-slate-50 dark:bg-slate-900/60 flex items-center justify-center mb-2 group-hover/empty:bg-teal-50 dark:group-hover/empty:bg-teal-950 transition-colors">
                  <svg
                    class="w-5 h-5 text-slate-400 group-hover/empty:text-teal-600 dark:group-hover/empty:text-teal-400 group-hover/empty:rotate-90 transition-transform duration-300"
                    fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                  </svg>
                </div>
                <span class="text-[10px] font-black uppercase tracking-wider">Book Session</span>
              </div>

            </div>
          </div>
        </div>
      </div>

    </main>
  </div>
</div>
