<div class="login-page-wrapper">
  <!-- Animated Fluid Teal & Turquoise Backdrop -->
  <div class="fluid-teal-backdrop">
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
    <div class="glow-orb orb-3"></div>
  </div>

  <!-- Attractive University Academic Vector Motifs (Floating) -->
  <div class="university-motifs">
    <svg class="motif-svg motif-cap" viewBox="0 0 100 100" aria-hidden="true">
      <polygon points="50,20 90,40 50,60 10,40" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" />
      <polygon points="30,50 30,75 50,85 70,75 70,50" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" />
      <path d="M70,40 L90,65 L90,80" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
      <circle cx="90" cy="80" r="3" fill="currentColor" />
    </svg>

    <svg class="motif-svg motif-books" viewBox="0 0 100 100" aria-hidden="true">
      <path d="M15,75 L80,75 L85,85 L20,85 Z" fill="none" stroke="currentColor" stroke-width="3" />
      <path d="M15,75 L15,81 L20,85" fill="none" stroke="currentColor" stroke-width="3" />
      <g transform="rotate(-15 45 45)">
        <rect x="30" y="25" width="45" height="15" rx="3" fill="none" stroke="currentColor" stroke-width="3" />
      </g>
    </svg>

    <svg class="motif-svg motif-chat" viewBox="0 0 100 100" aria-hidden="true">
      <path d="M20,25 H80 A5,5 0 0,1 85,30 V65 A5,5 0 0,1 80,70 H45 L25,85 V70 H20 A5,5 0 0,1 15,65 V30 A5,5 0 0,1 20,25 Z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" />
      <circle cx="35" cy="48" r="4" fill="currentColor" />
      <circle cx="50" cy="48" r="4" fill="currentColor" />
      <circle cx="65" cy="48" r="4" fill="currentColor" />
    </svg>

    <svg class="motif-svg motif-calendar" viewBox="0 0 100 100" aria-hidden="true">
      <rect x="20" y="25" width="60" height="55" rx="8" fill="none" stroke="currentColor" stroke-width="3" />
      <line x1="20" y1="42" x2="80" y2="42" stroke="currentColor" stroke-width="3" />
      <line x1="38" y1="18" x2="38" y2="28" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
      <line x1="62" y1="18" x2="62" y2="28" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
      <path d="M42,58 L48,64 L62,50" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </div>

  <div class="centered-container">
    <div class="login-card register-card">
      <!-- Logo & Header -->
      <div class="card-header-brand">
        <div class="logo-box">
          <!-- Stylized UUM Geometric SVG Logo -->
          <svg viewBox="0 0 100 100" class="uum-logo" aria-label="UUM Logo">
            <defs>
              <linearGradient id="uumGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#0F766E" />
                <stop offset="100%" stop-color="#2DD4BF" />
              </linearGradient>
            </defs>
            <path d="M50 5 L85 25 L85 65 L50 95 L15 65 L15 25 Z" fill="none" stroke="#2DD4BF" stroke-width="4" stroke-linejoin="round" />
            <path d="M50 12 L77 28 L77 60 L50 86 L23 60 L23 28 Z" fill="url(#uumGrad)" />
            <path d="M35 32 L35 55 C35 63, 65 63, 65 55 L65 32" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
            <polygon points="50,18 53,24 60,24 55,28 57,34 50,30 43,34 45,28 40,24 47,24" fill="#2DD4BF" />
          </svg>
        </div>
        <h2 class="project-title">STUDENT REGISTRATION</h2>
        <p class="welcome-message">Join ALCAS to schedule your consultations.</p>
      </div>

      <!-- Registration Form -->
      <form (ngSubmit)="onSubmit()" #registerForm="ngForm" class="login-form">
        
        <!-- Error / Success Alerts -->
        <div *ngIf="errorMessage" class="alert alert-danger animate-fade-in">
          <span class="alert-icon">⚠️</span>
          <span class="alert-text">{{ errorMessage }}</span>
        </div>

        <div *ngIf="successMessage" class="alert alert-success animate-fade-in">
          <span class="alert-icon">✨</span>
          <span class="alert-text">{{ successMessage }}</span>
        </div>

        <div *ngIf="!isSubmitted" class="form-grid-container">
          <!-- Matric Number -->
          <div class="form-group">
            <label for="studentIdNumber" class="form-label">Matric Number</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                  <circle cx="12" cy="7" r="4"></circle>
                </svg>
              </span>
              <input
                type="text"
                id="studentIdNumber"
                name="studentIdNumber"
                placeholder="e.g., 280123"
                [(ngModel)]="registerData.studentIdNumber"
                required
                class="form-control"
              />
            </div>
          </div>

          <!-- Full Name -->
          <div class="form-group">
            <label for="fullName" class="form-label">Full Name (as per IC/Passport)</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather">
                  <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                  <path d="M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4z"></path>
                </svg>
              </span>
              <input
                type="text"
                id="fullName"
                name="fullName"
                placeholder="Full Name"
                [(ngModel)]="registerData.fullName"
                required
                class="form-control"
              />
            </div>
          </div>

          <!-- Phone Number -->
          <div class="form-group">
            <label for="phone" class="form-label">Phone Number</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather">
                  <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
                </svg>
              </span>
              <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="e.g., +60123456789"
                [(ngModel)]="registerData.phone"
                required
                class="form-control"
              />
            </div>
          </div>

          <!-- School (Dropdown) -->
          <div class="form-group">
            <label for="school" class="form-label">School</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather">
                  <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
                  <path d="M6 12v5c0 2 2 3 6 3s6-1 6-3v-5"></path>
                </svg>
              </span>
              <select
                id="school"
                name="school"
                [(ngModel)]="registerData.school"
                (ngModelChange)="onSchoolChange()"
                required
                class="form-control select-control"
              >
                <option value="" disabled selected hidden>Select School</option>
                <option *ngFor="let s of schools" [value]="s">{{ s }}</option>
              </select>
            </div>
          </div>

          <!-- Program of Study (Dependent Dropdown) -->
          <div class="form-group">
            <label for="program" class="form-label">Program of Study</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather">
                  <path d="M4 19.5A2.5 2.5 0 0 1 6 17h12a2.5 2.5 0 0 1 2 4.5H6A2.5 2.5 0 0 1 4 19.5z"></path>
                  <path d="M6 2V17H18V2z"></path>
                </svg>
              </span>
              <select
                id="program"
                name="program"
                [(ngModel)]="registerData.program"
                [disabled]="!registerData.school"
                required
                class="form-control select-control"
              >
                <option value="" disabled selected hidden>Select Program</option>
                <option *ngFor="let p of availablePrograms" [value]="p">{{ p }}</option>
              </select>
            </div>
          </div>

          <!-- Email Address -->
          <div class="form-group">
            <label for="email" class="form-label">Email Address</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather">
                  <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                  <polyline points="22,6 12,13 2,6"></polyline>
                </svg>
              </span>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="name@uum.edu"
                [(ngModel)]="registerData.email"
                required
                class="form-control"
              />
            </div>
          </div>

          <!-- Password -->
          <div class="form-group">
            <label for="password" class="form-label">Password</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
              </span>
              <input
                [type]="showPassword ? 'text' : 'password'"
                id="password"
                name="password"
                placeholder="••••••••"
                [(ngModel)]="registerData.password"
                required
                class="form-control password-input"
              />
              <button type="button" (click)="togglePasswordVisibility()" class="password-toggle-btn" [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
                <svg *ngIf="!showPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg *ngIf="showPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
              </button>
            </div>
          </div>

          <!-- Confirm Password -->
          <div class="form-group">
            <label for="confirmPassword" class="form-label">Confirm Password</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
              </span>
              <input
                [type]="showConfirmPassword ? 'text' : 'password'"
                id="confirmPassword"
                name="confirmPassword"
                placeholder="••••••••"
                [(ngModel)]="registerData.confirmPassword"
                required
                class="form-control password-input"
              />
              <button type="button" (click)="toggleConfirmPasswordVisibility()" class="password-toggle-btn" [attr.aria-label]="showConfirmPassword ? 'Hide password' : 'Show password'">
                <svg *ngIf="!showConfirmPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg *ngIf="showConfirmPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
              </button>
            </div>
          </div>
        </div>

        <!-- Form Actions -->
        <div class="register-actions" *ngIf="!isSubmitted">
          <a routerLink="/login" class="btn-cancel">Cancel</a>
          <button type="submit" [disabled]="!registerForm.valid" class="btn-login-small">Submit</button>
        </div>

        <div class="register-footer" *ngIf="isSubmitted">
          <a routerLink="/login" class="register-link">Return to Login</a>
        </div>
      </form>
    </div>
  </div>
</div>
