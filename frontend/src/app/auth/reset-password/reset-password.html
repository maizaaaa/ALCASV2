<div class="login-page-wrapper">
  <!-- Animated Fluid Teal & Turquoise Backdrop -->
  <div class="fluid-teal-backdrop">
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
    <div class="glow-orb orb-3"></div>
  </div>

  <!-- Attractive University Academic Vector Motifs (Floating) -->
  <div class="university-motifs">
    <!-- Graduation Cap Motif -->
    <svg class="motif-svg motif-cap" viewBox="0 0 100 100" aria-hidden="true">
      <polygon points="50,20 90,40 50,60 10,40" fill="none" stroke="currentColor" stroke-width="3"
        stroke-linejoin="round" />
      <polygon points="30,50 30,75 50,85 70,75 70,50" fill="none" stroke="currentColor" stroke-width="3"
        stroke-linejoin="round" />
      <path d="M70,40 L90,65 L90,80" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
      <circle cx="90" cy="80" r="3" fill="currentColor" />
    </svg>

    <!-- Stack of Books Motif -->
    <svg class="motif-svg motif-books" viewBox="0 0 100 100" aria-hidden="true">
      <path d="M15,75 L80,75 L85,85 L20,85 Z" fill="none" stroke="currentColor" stroke-width="3" />
      <path d="M15,75 L15,81 L20,85" fill="none" stroke="currentColor" stroke-width="3" />
      <path d="M20,55 L75,55 L80,68 L25,68 Z" fill="none" stroke="currentColor" stroke-width="3" />
      <path d="M20,55 L20,62 L25,68" fill="none" stroke="currentColor" stroke-width="3" />
      <g transform="rotate(-15 45 45)">
        <rect x="30" y="25" width="45" height="15" rx="3" fill="none" stroke="currentColor" stroke-width="3" />
      </g>
    </svg>

    <!-- Consultation Chat Motif -->
    <svg class="motif-svg motif-chat" viewBox="0 0 100 100" aria-hidden="true">
      <path
        d="M20,25 H80 A5,5 0 0,1 85,30 V65 A5,5 0 0,1 80,70 H45 L25,85 V70 H20 A5,5 0 0,1 15,65 V30 A5,5 0 0,1 20,25 Z"
        fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" />
      <circle cx="35" cy="48" r="4" fill="currentColor" />
      <circle cx="50" cy="48" r="4" fill="currentColor" />
      <circle cx="65" cy="48" r="4" fill="currentColor" />
    </svg>

    <!-- Calendar Schedule Motif -->
    <svg class="motif-svg motif-calendar" viewBox="0 0 100 100" aria-hidden="true">
      <rect x="20" y="25" width="60" height="55" rx="8" fill="none" stroke="currentColor" stroke-width="3" />
      <line x1="20" y1="42" x2="80" y2="42" stroke="currentColor" stroke-width="3" />
      <line x1="38" y1="18" x2="38" y2="28" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
      <line x1="62" y1="18" x2="62" y2="28" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
      <path d="M42,58 L48,64 L62,50" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"
        stroke-linejoin="round" />
    </svg>
  </div>

  <div class="centered-container">
    <div class="login-card reset-card animate-fade-in">
      <!-- Header -->
      <div class="card-header-brand">
        <div class="logo-box">
          <svg viewBox="0 0 100 100" class="uum-logo" aria-label="UUM Logo">
            <defs>
              <linearGradient id="resetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#0F766E" />
                <stop offset="100%" stop-color="#2DD4BF" />
              </linearGradient>
            </defs>
            <path d="M50 5 L85 25 L85 65 L50 95 L15 65 L15 25 Z" fill="none" stroke="#2DD4BF" stroke-width="4"
              stroke-linejoin="round" />
            <path d="M50 12 L77 28 L77 60 L50 86 L23 60 L23 28 Z" fill="url(#resetGrad)" />
            <path d="M35 32 L35 55 C35 63, 65 63, 65 55 L65 32" fill="none" stroke="#FFFFFF" stroke-width="6"
              stroke-linecap="round" />
            <polygon points="50,18 53,24 60,24 55,28 57,34 50,30 43,34 45,28 40,24 47,24" fill="#2DD4BF" />
          </svg>
        </div>
        <h2 class="project-title">CREATE NEW PASSWORD</h2>
        <p class="welcome-message">Enter your new credentials to restore portal access</p>
      </div>

      <!-- Verified Link Notice -->
      <div *ngIf="hasPresetEmail"
        style="display:flex; align-items:center; gap:10px; background:#F0FDFA; border:1px solid #99F6E4; border-radius:10px; padding:10px 14px; margin-bottom:16px;">
        <span style="font-size:18px;">🛡️</span>
        <div style="flex:1; overflow:hidden;">
          <div style="font-size:11px; text-transform:uppercase; letter-spacing:0.5px; color:#0F766E; font-weight:700;">
            Verified Reset Target</div>
          <div
            style="font-size:13px; font-weight:600; color:#134E4A; text-overflow:ellipsis; overflow:hidden; white-space:nowrap;">
            {{ email }}</div>
        </div>
        <span
          style="background:#0D9488; color:#FFFFFF; font-size:11px; font-weight:700; padding:3px 8px; border-radius:12px;">Active
          Link</span>
      </div>

      <!-- Reset Password Form -->
      <form (ngSubmit)="onSubmit()" #resetForm="ngForm" class="login-form">
        <!-- Error / Success Alerts -->
        <div *ngIf="errorMessage" class="alert alert-danger animate-fade-in">
          <span class="alert-icon">⚠️</span>
          <span class="alert-text">{{ errorMessage }}</span>
        </div>

        <div *ngIf="successMessage" class="alert alert-success animate-fade-in">
          <span class="alert-icon">✨</span>
          <span class="alert-text">{{ successMessage }}</span>
        </div>

        <!-- Email Field (If not provided in reset link) -->
        <div class="form-group" *ngIf="!hasPresetEmail && !isSuccess">
          <label for="email" class="form-label">University Email</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
              </svg>
            </span>
            <input type="email" id="email" name="email" placeholder="e.g. nur_aisyah@soc.uum.edu.my" [(ngModel)]="email"
              required class="form-control" />
          </div>
        </div>

        <!-- Verification Code Field (If not provided in reset link) -->
        <div class="form-group" *ngIf="!hasPresetCode && !isSuccess">
          <label for="code" class="form-label">6-Digit Verification Code</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </span>
            <input type="text" id="code" name="code" placeholder="e.g. 123456" [(ngModel)]="code" required maxlength="6"
              class="form-control" style="letter-spacing:2px; font-weight:600;" />
          </div>
        </div>

        <!-- New Password Input -->
        <div class="form-group" *ngIf="!isSuccess">
          <label for="newPassword" class="form-label">New Password</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </span>
            <input [type]="showNewPassword ? 'text' : 'password'" id="newPassword" name="newPassword"
              placeholder="Enter at least 6 characters" [(ngModel)]="newPassword" required minlength="6"
              class="form-control" #newPassRef="ngModel" />
            <button type="button" (click)="toggleShowNewPassword()" class="password-toggle-btn" tabindex="-1"
              aria-label="Toggle password visibility"
              style="background:none; border:none; cursor:pointer; color:#94A3B8; padding:0 10px; display:flex; align-items:center;">
              <svg *ngIf="!showNewPassword" style="width:18px; height:18px;" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg *ngIf="showNewPassword" style="width:18px; height:18px;" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2">
                <path
                  d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24">
                </path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
          <small style="display:block; margin-top:4px; font-size:12px; color:#64748B;">
            Minimum 6 characters with letters and numbers recommended.
          </small>
        </div>

        <!-- Confirm Password Input -->
        <div class="form-group" *ngIf="!isSuccess">
          <label for="confirmPassword" class="form-label">Confirm New Password</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                <polyline points="22 4 12 14.01 9 11.01"></polyline>
              </svg>
            </span>
            <input [type]="showConfirmPassword ? 'text' : 'password'" id="confirmPassword" name="confirmPassword"
              placeholder="Re-enter your new password" [(ngModel)]="confirmPassword" required class="form-control"
              #confirmPassRef="ngModel" />
            <button type="button" (click)="toggleShowConfirmPassword()" class="password-toggle-btn" tabindex="-1"
              aria-label="Toggle confirm password visibility"
              style="background:none; border:none; cursor:pointer; color:#94A3B8; padding:0 10px; display:flex; align-items:center;">
              <svg *ngIf="!showConfirmPassword" style="width:18px; height:18px;" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg *ngIf="showConfirmPassword" style="width:18px; height:18px;" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2">
                <path
                  d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24">
                </path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" [disabled]="!resetForm.valid || isSubmitting || isSuccess" class="btn-login"
          *ngIf="!isSuccess">
          <span *ngIf="!isSubmitting">Set New Password</span>
          <span *ngIf="isSubmitting" style="display:flex; align-items:center; justify-content:center; gap:8px;">
            <svg class="animate-spin" style="width:18px; height:18px; animation:spin 1s linear infinite;"
              viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
              <circle cx="12" cy="12" r="10" stroke-opacity="0.25"></circle>
              <path d="M12 2 A10 10 0 0 1 22 12" stroke-linecap="round"></path>
            </svg>
            Updating Password...
          </span>
          <svg *ngIf="!isSubmitting" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" class="btn-arrow-icon">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>

        <!-- Back to Login option -->
        <div class="register-footer" style="margin-top:20px;">
          <a routerLink="/login" class="register-link">Return to Login</a>
        </div>
      </form>
    </div>
  </div>
</div>
