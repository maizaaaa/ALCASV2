<div class="login-page-wrapper">

  <!-- Animated Fluid Teal & Turquoise Backdrop -->
  <div class="fluid-teal-backdrop">
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
    <div class="glow-orb orb-3"></div>
  </div>

  <!-- Attractive University Academic Vector Motifs (Floating) -->
  <div class="university-motifs">
    <!-- Graduation Cap Motif -->
    <svg class="motif-svg motif-cap" viewBox="0 0 100 100" aria-hidden="true">
      <polygon points="50,20 90,40 50,60 10,40" fill="none" stroke="currentColor" stroke-width="3"
        stroke-linejoin="round" />
      <polygon points="30,50 30,75 50,85 70,75 70,50" fill="none" stroke="currentColor" stroke-width="3"
        stroke-linejoin="round" />
      <path d="M70,40 L90,65 L90,80" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
      <circle cx="90" cy="80" r="3" fill="currentColor" />
    </svg>

    <!-- Stack of Books Motif -->
    <svg class="motif-svg motif-books" viewBox="0 0 100 100" aria-hidden="true">
      <path d="M15,75 L80,75 L85,85 L20,85 Z" fill="none" stroke="currentColor" stroke-width="3" />
      <path d="M15,75 L15,81 L20,85" fill="none" stroke="currentColor" stroke-width="3" />
      <path d="M20,55 L75,55 L80,68 L25,68 Z" fill="none" stroke="currentColor" stroke-width="3" />
      <path d="M20,55 L20,62 L25,68" fill="none" stroke="currentColor" stroke-width="3" />
      <g transform="rotate(-15 45 45)">
        <rect x="30" y="25" width="45" height="15" rx="3" fill="none" stroke="currentColor" stroke-width="3" />
      </g>
    </svg>

    <!-- Consultation Chat Motif -->
    <svg class="motif-svg motif-chat" viewBox="0 0 100 100" aria-hidden="true">
      <path
        d="M20,25 H80 A5,5 0 0,1 85,30 V65 A5,5 0 0,1 80,70 H45 L25,85 V70 H20 A5,5 0 0,1 15,65 V30 A5,5 0 0,1 20,25 Z"
        fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" />
      <circle cx="35" cy="48" r="4" fill="currentColor" />
      <circle cx="50" cy="48" r="4" fill="currentColor" />
      <circle cx="65" cy="48" r="4" fill="currentColor" />
    </svg>

    <!-- Calendar Schedule Motif -->
    <svg class="motif-svg motif-calendar" viewBox="0 0 100 100" aria-hidden="true">
      <rect x="20" y="25" width="60" height="55" rx="8" fill="none" stroke="currentColor" stroke-width="3" />
      <line x1="20" y1="42" x2="80" y2="42" stroke="currentColor" stroke-width="3" />
      <line x1="38" y1="18" x2="38" y2="28" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
      <line x1="62" y1="18" x2="62" y2="28" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
      <path d="M42,58 L48,64 L62,50" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"
        stroke-linejoin="round" />
    </svg>
  </div>

  <div class="centered-container">
    <div class="login-card success-card animate-fade-in">
      <!-- Logo & Header -->
      <div class="card-header-brand">
        <div class="logo-box">
          <svg viewBox="0 0 100 100" class="uum-logo" aria-label="UUM Logo">
            <defs>
              <linearGradient id="uumGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#0F766E" />
                <stop offset="100%" stop-color="#2DD4BF" />
              </linearGradient>
            </defs>
            <path d="M50 5 L85 25 L85 65 L50 95 L15 65 L15 25 Z" fill="none" stroke="#2DD4BF" stroke-width="4"
              stroke-linejoin="round" />
            <path d="M50 12 L77 28 L77 60 L50 86 L23 60 L23 28 Z" fill="url(#uumGrad)" />
            <path d="M35 32 L35 55 C35 63, 65 63, 65 55 L65 32" fill="none" stroke="#FFFFFF" stroke-width="6"
              stroke-linecap="round" />
            <polygon points="50,18 53,24 60,24 55,28 57,34 50,30 43,34 45,28 40,24 47,24" fill="#2DD4BF" />
          </svg>
        </div>
        <h2 class="project-title">Account Created!</h2>
        <p class="welcome-message">We've sent a verification link to your email.</p>
      </div>

      <!-- Success Details Content -->
      <div class="success-content">

        <p class="success-instruction">
          Please click the link in your email to activate your <strong>ALCAS student account</strong>.
        </p>

        <!-- Alerts Block for Resend -->
        <div *ngIf="errorMessage" class="alert alert-danger animate-fade-in">
          <span class="alert-icon">⚠️</span>
          <span class="alert-text">{{ errorMessage }}</span>
        </div>

        <div *ngIf="successMessage" class="alert alert-success animate-fade-in">
          <span class="alert-icon">✨</span>
          <span class="alert-text">{{ successMessage }}</span>
        </div>

        <!-- Resend Section -->
        <div class="resend-section">
          <p class="resend-text">Didn't get the verification email?</p>
          <button (click)="resendEmail()" [disabled]="isResending" class="btn-resend">
            <span *ngIf="!isResending">Resend Verification Email</span>
            <span *ngIf="isResending" class="loading-dots">Sending...</span>
          </button>
        </div>

        <!-- Footer Actions -->
        <div class="success-footer">
          <a routerLink="/login" class="btn-login-small back-to-login-btn">
            <span>Return to Login</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round" class="btn-arrow-icon">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
