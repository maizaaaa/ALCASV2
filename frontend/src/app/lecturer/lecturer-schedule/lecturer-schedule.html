<div class="lecturer-layout">

  <!-- Shared Lecturer Sidebar -->
  <app-sidebar-lect></app-sidebar-lect>

  <!-- Main Content Area -->
  <main class="main-content dashboard-modern-bg">
    <div class="dashboard-wrapper">

      <div class="dashboard-header flex-between">
        <div>
          <h1 class="page-title">My Schedule</h1>
          <p class="page-subtitle">Manage your availability, classes, and busy blocks for the week.</p>
        </div>
        <button class="btn-primary" (click)="openAddSlotModal()">+ Add Time Slot</button>
      </div>

      <div class="weekly-planner">

        <div class="glass-card day-column" *ngFor="let day of weekDays">
          <div class="day-header">
            <h3>{{ day }}</h3>
          </div>

          <div class="day-slots">
            <div class="empty-day" *ngIf="getSlotsForDay(day).length === 0">
              No slots scheduled
            </div>

            <div class="slot-card" *ngFor="let slot of getSlotsForDay(day)" [ngClass]="slot.type.toLowerCase() + '-border'">

              <div class="slot-header flex-between">
                <span class="type-tag" [ngClass]="slot.type.toLowerCase()">{{ slot.type }}</span>
                <div class="icon-group">
                  <button class="edit-icon" (click)="editSlot(slot)" title="Edit Slot">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                  </button>
                  <button class="delete-icon" (click)="deleteSlot(slot.id)" title="Delete Slot">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                  </button>
                </div>
              </div>

              <div class="slot-title">{{ slot.title }}</div>
              <div class="slot-time">
                <svg class="time-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                {{ slot.startTime }} - {{ slot.endTime }}
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </main>

  <div class="modal-backdrop" *ngIf="showModal">
    <div class="modal-container fade-in-up">
      <div class="modal-header">
        <h2 *ngIf="!isEditing">Add Schedule Slot</h2>
        <h2 *ngIf="isEditing">Edit Schedule Slot</h2>
        <button class="close-btn" (click)="closeModal()">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="24" height="24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>

      <div class="modal-body">

        <div class="form-row gap-4">
          <div class="form-group flex-1">
            <label>Day of Week</label>
            <select [(ngModel)]="slotForm.day" class="modern-select">
              <option *ngFor="let d of weekDays" [value]="d">{{ d }}</option>
            </select>
          </div>
          <div class="form-group flex-1">
            <label>Slot Type</label>
            <select [(ngModel)]="slotForm.type" class="modern-select">
              <option value="AVAILABLE">Consultation (Available)</option>
              <option value="CLASS">Class / Lecture</option>
              <option value="BUSY">Busy / Blocked</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label>Title / Description</label>
          <input type="text" [(ngModel)]="slotForm.title" class="modern-input" placeholder="e.g. Open for FYP Students">
        </div>

        <div class="form-row gap-4">
          <div class="form-group flex-1">
            <label>Start Time</label>
            <input type="time" [(ngModel)]="slotForm.startTime" class="modern-input">
          </div>
          <div class="form-group flex-1">
            <label>End Time</label>
            <input type="time" [(ngModel)]="slotForm.endTime" class="modern-input">
          </div>
        </div>

      </div>

      <div class="modal-footer">
        <button class="btn-text" (click)="closeModal()">Cancel</button>
        <button class="btn-primary" (click)="saveSlot()">{{ isEditing ? 'Save Changes' : 'Add to Schedule' }}</button>
      </div>
    </div>
  </div>

</div>
