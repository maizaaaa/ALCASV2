spring.application.name=backend

spring.datasource.url=jdbc:mysql://localhost:3306/alcas
spring.datasource.username=root
spring.datasource.password=...

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

jwt.secret=CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_KEY_12345678901234567890
jwt.expiration=86400000

logging.level.org.springframework.security=DEBUG

# University Mail Configuration (Gmail SMTP Relay)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:i}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Frontend Base URL for links
app.frontend.url=${FRONTEND_URL:http://localhost:4200}
